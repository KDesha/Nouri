[build]
  command = "npm --prefix backend ci && npm --prefix backend run build:netlify"
  publish = "backend/public"

[functions]
  directory = "backend/netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["express", "pg", "serverless-http"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true
